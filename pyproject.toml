[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeshield-ai"
version = "1.0.0"
description = "Adaptive self-correcting on-device cybersecurity intelligence for Arm Linux"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "numpy>=1.26",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
network = ["scapy>=2.5"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
